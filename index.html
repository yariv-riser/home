<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ראייזר דיגיטל | בקרוב</title>
  <style>
    :root {
      --primary-purple: #8A2BE2;
      --light-purple: #a445ff;
      --bg-white: #ffffff;
      --text-black: #1a1a1a;
      --text-gray: #4a4a4a;
    }

    body,
    html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-white);
      color: var(--text-black);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .background-blob {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(138, 43, 226, 0.05) 0%, rgba(255, 255, 255, 0) 70%);
      z-index: 0;
      top: -100px;
      left: -100px;
    }

    .container {
      text-align: center;
      z-index: 1;
      padding: 20px;
      max-width: 750px;
      width: 100%;
      animation: fadeInPage 1.5s ease-out;
    }

    .logo {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 3px;
      color: var(--primary-purple);
      margin-bottom: 20px;
    }

    /* אפקט ה-Shimmer לכותרת */
    .cool-title {
      font-size: clamp(2.8rem, 8vw, 4.8rem);
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 25px;
      background: linear-gradient(to right,
          var(--text-black) 20%,
          var(--primary-purple) 40%,
          var(--light-purple) 60%,
          var(--text-black) 80%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 4s linear infinite;
    }

    .divider {
      width: 80px;
      height: 4px;
      background: var(--primary-purple);
      margin: 0 auto 35px auto;
      border-radius: 2px;
    }

    p {
      font-size: clamp(1.1rem, 2vw, 1.35rem);
      color: var(--text-gray);
      line-height: 1.8;
      margin: 0 auto;
      max-width: 650px;
      font-weight: 400;
    }

    .footer {
      position: absolute;
      bottom: 30px;
      width: 100%;
      text-align: center;
      color: #999;
      font-size: 0.9rem;
    }

    @keyframes shine {
      to {
        background-position: 200% center;
      }
    }

    @keyframes fadeInPage {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .container {
        padding: 30px;
      }
    }
  </style>
</head>

<body>

  <div class="background-blob"></div>

  <div class="container">
    <div class="logo">RISER</div>
    <h1 class="cool-title">ראייזר דיגיטל.</h1>
    <div class="divider"></div>
    <p>
      אנחנו עובדים במרץ על השקת סוכנות הדיגיטל שתשנה את הדרך שבה העסק שלכם צומח.
      במרכז העשייה של <strong>ראייזר</strong> עומדת השאיפה לקחת מותגים, מוצרים ושירותים ולהטיס אותם קדימה.
      <br />
      האתר החדש שלנו נמצא בשלבי פיתוח אחרונים – יש למה לחכות.
    </p>
  </div>

  <div class="footer">
    &copy; 2025 ראייזר דיגיטל | כל הזכויות שמורות
  </div>

</body>

</html>
